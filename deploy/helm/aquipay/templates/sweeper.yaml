{{- if .Values.sweeper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aquipay.fullname" . }}-sweeper
  labels:
    {{- include "aquipay.labels" . | nindent 4 }}
    app.kubernetes.io/component: sweeper
spec:
  # Exactly one: two sweepers would race on the same account nonce.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aquipay.selectorLabels" (dict "root" . "component" "sweeper") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aquipay.selectorLabels" (dict "root" . "component" "sweeper") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "aquipay.podScheduling" . | nindent 6 }}
      containers:
        - name: sweeper
          image: {{ include "aquipay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["sweeper"]
          env:
            {{- include "aquipay.env" (dict "root" .) | nindent 12 }}
            - name: SWEEP_INTERVAL_SECONDS
              value: {{ .Values.sweeper.intervalSeconds | quote }}
            - name: SWEEP_BATCH_SIZE
              value: {{ .Values.sweeper.batchSize | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.sweeper.existingSecret }}
          resources:
            {{- toYaml .Values.sweeper.resources | nindent 12 }}
          {{- include "aquipay.containerSecurity" . | nindent 10 }}
{{- end }}
