apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aquipay.fullname" . }}-migrate
  labels:
    {{- include "aquipay.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs before the new pods roll out, on install and on every upgrade.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "aquipay.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "aquipay.podScheduling" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "aquipay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "aquipay.env" (dict "root" .) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- include "aquipay.containerSecurity" . | nindent 10 }}
