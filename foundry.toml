# The Foundry project root is the repository root so that sources and the npm
# dependencies under node_modules sit inside one tree.
[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
libs = ["node_modules"]
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
]
solc = "0.8.28"
# paris keeps the bytecode valid on every target chain; the bytecode must be
# byte-identical everywhere so invoice addresses match across chains.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
